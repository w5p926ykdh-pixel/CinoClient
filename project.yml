
name: CinoClient

options:
  bundleIdPrefix: com.cino

targets:
  CinnySwift:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources/CinoClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cino.CinoClient
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"

schemes:
  CinoClient:
    build:
      targets:
        CinoClient: all
